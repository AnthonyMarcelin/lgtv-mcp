services:
  lgtv-mcp:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; h=os.environ.get('MCP_BIND_HOST','127.0.0.1'); h='127.0.0.1' if h in ('0.0.0.0','::') else h; urllib.request.urlopen(f\"http://{h}:{os.environ.get('MCP_PORT','8765')}/healthz\", timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
