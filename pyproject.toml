[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgtv-mcp"
version = "0.1.0"
description = "MCP server to control an LG OLED C2 (webOS 22) over LAN"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.27,<2",
    "bscpylgtv>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
lgtv-mcp = "lgtv_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lgtv_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/lgtv_mcp/manifest_comp.json" = "lgtv_mcp/manifest_comp.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
